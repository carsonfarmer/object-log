[package]
name = "object-log-spin-key-value"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Native object-log provider for Spin key-value runtimes"
readme = "README.md"
publish = false

# Keep Spin's host dependency graph outside the portable core workspace.
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1.8"
bytes = "1.10"
object-log = { path = "../..", features = ["aws"] }
object-log-kv = { path = "../../crates/object-log-kv" }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
spin-factor-key-value = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }

[dev-dependencies]
spin-tls = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
http = "1"
http-body-util = "0.1"
spin-app = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-factors = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-factors-executor = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-factor-wasi = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-factor-outbound-networking = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-factor-outbound-http = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-factor-variables = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-loader = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-trigger = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
spin-trigger-http = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
object-log = { path = "../..", features = ["test-util"] }
object_store = { version = "0.14", features = ["fs"] }
tempfile = "3"
spin-core = { git = "https://github.com/spinframework/spin", rev = "c0b3726aa4857961e20cf8616a0df5f0741af73d" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0
