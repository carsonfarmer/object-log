[package]
name = "object-log-git-spin"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[features]
operator = ["dep:clap", "dep:serde", "dep:serde_json", "dep:toml", "dep:tokio", "dep:url", "dep:libc"]

[[bin]]
name = "object-log-git-maintain"
path = "src/bin/object-log-git-maintain.rs"
required-features = ["operator"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
humantime = "2"
object-log = { path = "../.." }
object-log-git = { path = "../object-log-git", default-features = false }
object_store = { version = "=0.14.1", default-features = false, features = ["aws-base"] }
sha2 = "0.10"
spin-sdk = { version = "=5.2.0", default-features = false }
spin-executor = "=5.2.0"
wasi = "=0.13.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[example]]
name = "transport_probe"
crate-type = ["cdylib"]

[dev-dependencies]
object-log = { path = "../..", features = ["test-util"] }
wasmparser = "=0.244.0"

[[example]]
name = "memory_lifecycle"
crate-type = ["cdylib"]

# The MinIO driver is native test code; the component retains its WASI transport.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"], optional = true }
tokio = { version = "1.47", features = ["rt", "time"], optional = true }
url = { version = "2", optional = true }
object_store = { version = "=0.14.1", default-features = false, features = ["aws"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
object_store = { version = "=0.14.1", default-features = false, features = ["aws"] }
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
