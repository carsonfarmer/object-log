[package]
name = "object-log-git-spin"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
humantime = "2"
object-log = { path = "../.." }
object-log-git = { path = "../object-log-git", default-features = false }
object_store = { version = "=0.14.1", default-features = false, features = ["aws-base"] }
sha2 = "0.10"
spin-sdk = { version = "=5.2.0", default-features = false }
spin-executor = "=5.2.0"
wasi = "=0.13.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[example]]
name = "transport_probe"
crate-type = ["cdylib"]

[dev-dependencies]
wasmparser = "=0.244.0"

[[example]]
name = "memory_lifecycle"
crate-type = ["cdylib"]
