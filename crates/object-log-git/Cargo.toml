[package]
name = "object-log-git"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Git repository demonstration for object-log"
license = "Apache-2.0"
publish = false

[features]
default = ["native-oracle"]
native-oracle = ["dep:gix", "dep:gix-pack", "dep:tokio"]
aws = ["native-oracle", "object_store/aws"]

[dependencies]
bstr = { version = "1.12", default-features = false, features = ["std"] }
bytes = "1.10"
gix = { version = "0.87.1", default-features = false, features = ["revision", "sha1", "sha256"], optional = true }
gix-pack = { version = "0.74.2", default-features = false, features = ["generate", "sha1", "sha256", "streaming-input"], optional = true }
gix-validate = "0.11.4"
minicbor = { version = "2.3", features = ["derive", "std"] }
object-log = { path = "../.." }
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util"], optional = true }

[dev-dependencies]
criterion = "0.7"
futures = "0.3"
object-log = { path = "../..", features = ["test-util"] }
object_store = "0.14"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[bench]]
name = "git"
harness = false
