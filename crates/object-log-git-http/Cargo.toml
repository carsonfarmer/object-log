[package]
name = "object-log-git-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Git smart HTTP proof for object-log"
license = "Apache-2.0"
publish = false

[dependencies]
bytes = "1.10"
gix-packetline = { version = "0.22.2", default-features = false }
object-log = { path = "../.." }
object-log-git = { path = "../object-log-git" }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util"] }

[dev-dependencies]
object-log = { path = "../..", features = ["test-util"] }
object_store = "0.14"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
