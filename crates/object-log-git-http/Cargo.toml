[package]
name = "object-log-git-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Git smart HTTP proof for object-log"
license = "Apache-2.0"
publish = false

[dependencies]
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
axum = "0.8"
bytes = "1.10"
futures = "0.3"
http-body-util = "0.1"
object-log = { path = "../.." }
object-log-git = { path = "../object-log-git" }
object_store = { version = "0.14", features = ["aws"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3.20"
object-log = { path = "../..", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
