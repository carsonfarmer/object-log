[package]
name = "object-log-component"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Composable WASIp2 interface for object-log backed by S3"
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[features]
test-imds = []
[[example]]
name = "credential-client"
path = "tests/fixtures/credential-client.rs"
crate-type = ["cdylib"]
required-features = ["test-imds"]
[dependencies]
object-log = { path = "../.." }
object_store = { version = "=0.14.1", default-features = false, features = ["aws-base"] }
bytes = "1"
futures = "0.3"
wit-bindgen = "0.46"
async-trait = "0.1"
hmac = "0.12"
humantime = "2"
http = "1"
http-body = "1"
http-body-util = "0.1"
sha2 = "0.10"
wasi = "0.13"
uuid = { version = "1", default-features = false }
[dev-dependencies]
object-log = { path = "../..", features = ["test-util"] }
spin-sdk = { version = "=5.2.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
