spin_manifest_version = 2
[application]
name = "wal-git"
version = "0.0.0"

[variables]
wal_endpoint = { default = "http://127.0.0.1:19090" }
wal_bucket = { default = "wal-proof" }
wal_region = { default = "us-east-1" }
wal_prefix = { default = "" }
wal_access_key = { default = "", secret = true }
wal_secret_key = { default = "", secret = true }
wal_session_token = { default = "", secret = true }
wal_default_branch = { default = "" }
git_password = { default = "", secret = true }
git_boot_id = { default = "local-boot" }
git_read_only = { default = "false" }
git_max_push_bytes = { default = "2147483648" }
git_max_negotiation_bytes = { default = "8388608" }
git_max_object_bytes = { default = "1073741824" }
git_max_metadata_bytes = { default = "16777216" }
git_max_pack_objects = { default = "1000000" }
git_max_catalog_bytes = { default = "67108864" }
git_request_timeout = { default = "5m" }

[[trigger.http]]
route = "/..."
component = "git"

[component.git]
source = "git.wasm"
allowed_outbound_hosts = ["{{ wal_endpoint }}"]
[component.git.variables]
wal_endpoint = "{{ wal_endpoint }}"
wal_bucket = "{{ wal_bucket }}"
wal_region = "{{ wal_region }}"
wal_prefix = "{{ wal_prefix }}"
wal_access_key = "{{ wal_access_key }}"
wal_secret_key = "{{ wal_secret_key }}"
wal_session_token = "{{ wal_session_token }}"
wal_default_branch = "{{ wal_default_branch }}"
git_password = "{{ git_password }}"
git_boot_id = "{{ git_boot_id }}"
git_read_only = "{{ git_read_only }}"
git_max_push_bytes = "{{ git_max_push_bytes }}"
git_max_negotiation_bytes = "{{ git_max_negotiation_bytes }}"
git_max_object_bytes = "{{ git_max_object_bytes }}"
git_max_metadata_bytes = "{{ git_max_metadata_bytes }}"
git_max_pack_objects = "{{ git_max_pack_objects }}"
git_max_catalog_bytes = "{{ git_max_catalog_bytes }}"
git_request_timeout = "{{ git_request_timeout }}"
